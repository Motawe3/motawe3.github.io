<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cairo Kernel</title>
<meta name="description" content="Cairo Kernel, an independent game developer.">
<style>
  :root { --bg: #F0E3D2; --card: #FBF5EC; --ink: #3B3129; --muted: #6E6158; --accent: #B5655A; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #221D19; --card: #2D2622; --ink: #F0E6DA; --muted: #BFB1A3; --accent: #E89A8D; color-scheme: dark; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 32px 16px; }
  main { max-width: 720px; margin: 0 auto; background: var(--card); border-radius: 20px; padding: 32px clamp(20px, 5vw, 48px); }
  h1 { margin: 0 0 8px; }
  h2 { font-size: 1.2rem; margin: 1.6em 0 0.3em; }
  a { color: var(--accent); }
  .muted { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Cairo Kernel</h1>
  <p class="muted">An independent game developer.</p>

  <h2>Sandemonium</h2>
  <p>A sand puzzle game for Android.<br>
  <a href="sandemonium/privacy/">Privacy policy</a></p>

  <h2>Contact</h2>
  <p><a href="mailto:cairokernel@gmail.com">cairokernel@gmail.com</a></p>
</main>
</body>
</html>
